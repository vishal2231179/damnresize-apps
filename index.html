<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DamnResize - Sarkari Photo & Signature Resizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col"> 
    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">DamnResize<span class="text-amber-300">.in</span></h1>
            <p class="text-sm bg-indigo-700 px-3 py-1 rounded-full">Sarkari Exam Photo & Sign Stamping Tool</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto flex-grow p-6 w-full">
        <div class="bg-white rounded-2xl shadow-lg p-8 border border-slate-100">
            <h2 class="text-xl font-semibold mb-4 text-slate-700">Upload Photo / Signature</h2>
            
            <!-- File Input -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-600 mb-2">Select Image File</label>
                <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border border-slate-200 rounded-xl p-2"/>
            </div>

            <!-- Stamp Inputs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Candidate Name</label>
                    <input type="text" id="candidateName" placeholder="e.g. VISHAL PRAJAPATI" class="w-full border border-slate-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Photo Date</label>
                    <input type="date" id="photoDate" class="w-full border border-slate-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                </div>
            </div>

            <!-- Preview & Canvas Section -->
            <div class="flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-2xl p-6 mb-6 bg-slate-50">
                <canvas id="outputCanvas" class="max-w-full shadow-sm rounded-lg mb-4 hidden"></canvas>
                <p id="placeholderText" class="text-slate-400 text-sm">Preview will appear here after selecting an image</p>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-4">
                <button id="processBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition shadow-lg shadow-indigo-100">Stamp & Resize</button>
                <a id="downloadBtn" class="hidden flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-xl text-center transition shadow-lg shadow-emerald-100" download="stamped_photo.jpg">Download Image</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-sm text-slate-500">
        &copy; 2026 DamnResize.in. All rights reserved.
    </footer>

    <!-- Script Logic -->
    <script>
        const imageInput = document.getElementById('imageInput');
        const candidateNameInput = document.getElementById('candidateName');
        const photoDateInput = document.getElementById('photoDate');
        const processBtn = document.getElementById('processBtn');
        const outputCanvas = document.getElementById('outputCanvas');
        const placeholderText = document.getElementById('placeholderText');
        const downloadBtn = document.getElementById('downloadBtn');

        let uploadedImage = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImage = new Image();
                    uploadedImage.onload = function() {
                        placeholderText.classList.add('hidden');
                        outputCanvas.classList.remove('hidden');
                        drawCanvas();
                    }
                    uploadedImage.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function drawCanvas() {
            if (!uploadedImage) return;
            const ctx = outputCanvas.getContext('2d');
            
            // Set dimensions
            outputCanvas.width = uploadedImage.width;
            outputCanvas.height = uploadedImage.height + 60; // Extra space for stamp

            // Draw original image
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
            ctx.drawImage(uploadedImage, 0, 0);

            // Draw Stamp Background Box
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, uploadedImage.height, outputCanvas.width, 60);

            // Draw Text
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `${Math.max(16, outputCanvas.width / 25)}px Arial`;
            ctx.textAlign = 'center';
            
            const name = candidateNameInput.value.toUpperCase() || 'CANDIDATE NAME';
            const date = photoDateInput.value ? new Date(photoDateInput.value).toLocaleDateString() : 'DD-MM-YYYY';
            
            ctx.fillText(name, outputCanvas.width / 2, uploadedImage.height + 25);
            ctx.fillText(`DOB/Date: ${date}`, outputCanvas.width / 2, uploadedImage.height + 50);

            // Setup download link
            downloadBtn.href = outputCanvas.toDataURL('image/jpeg', 0.9);
        }

        processBtn.addEventListener('click', () => {
            if (!uploadedImage) {
                alert('Please select an image first!');
                return;
            }
            drawCanvas();
            alert('Photo successfully stamped!');
        });
    </script>
</body>
</html>
