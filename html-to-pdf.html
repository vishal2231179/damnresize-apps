<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="navigation.js" defer></script>
    <title>HTML to PDF Converter | DamnResize.in</title>
    <meta name="description" content="Convert HTML code or a web page to PDF online. Create a downloadable PDF from your HTML using a browser-based converter.">
    <link rel="canonical" href="https://damnresize.in/html-to-pdf.html">
    <link rel="icon" href="/damnresize-favicon.svg" type="image/svg+xml">

    <!-- html2canvas: browser-rendered HTML screenshot -->

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center relative">
            <div class="flex items-center">
                <a href="index.html" class="flex items-center group">
                    <img src="damnresize-v4-dark.svg" alt="DamnResize.in Logo" class="h-14 md:h-16 w-auto object-contain group-hover:scale-105 transition">
                </a>
            </div>
            <nav class="hidden md:flex space-x-8 text-sm font-medium text-slate-300 absolute left-1/2 -translate-x-1/2 items-center">
                <a href="index.html" class="hover:text-indigo-400 transition">Home</a>
                <a href="index.html#tools" class="text-indigo-400 font-semibold transition">PDF Tools</a>
                <a href="exams.html" class="hover:text-indigo-400 transition">Govt Exam Photo</a>
                <a href="AddText.html" class="hover:text-indigo-400 transition">AddText</a>
            </nav>
            <div class="flex items-center">
                <a href="index.html#tools" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-lg shadow-indigo-500/20">Back to PDF Suite</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full" id="html-to-pdf">

        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-yellow-400 to-amber-400 bg-clip-text text-transparent mb-3">
                🌐 HTML to PDF Converter
            </h1>
            <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">
                Paste your HTML code (with CSS, fonts and colors) to render it exactly and download it as a PDF.
            </p>
        </div>

        <!-- Converter Box -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl mb-8">

            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Paste HTML Code or Content:</label>
                <textarea id="htmlInput" rows="10" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-sm text-slate-200 font-mono focus:outline-none focus:border-yellow-500 transition">&lt;style&gt;
  body { font-family: Georgia, serif; color: #1e293b; }
  h1 { color: #4f46e5; border-bottom: 3px solid #fbbf24; padding-bottom: 8px; }
  .box { background: #fef3c7; padding: 16px; border-radius: 8px; }
&lt;/style&gt;
&lt;h1&gt;DamnResize.in Document&lt;/h1&gt;
&lt;div class="box"&gt;&lt;b&gt;Features:&lt;/b&gt; Fast, secure, and fully client-side rendering!&lt;/div&gt;
&lt;hr&gt;
&lt;p&gt;This document keeps its own fonts, colors and layout.&lt;/p&gt;</textarea>
            </div>

            <!-- Live Preview (isolated iframe so CSS does not leak into this page) -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Live Preview:</label>
                <iframe id="previewFrame" class="w-full h-96 bg-white rounded-xl border border-slate-700"></iframe>
            </div>

            <button type="button" id="convertBtn" class="w-full bg-yellow-600 hover:bg-yellow-500 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-yellow-500/20 text-base cursor-pointer">
                ⚡ Convert HTML to PDF & Download
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-900/40 text-center py-6 text-xs text-slate-500 mt-12">
        <p>&copy; 2026 DamnResize.in. All rights reserved. Secure Browser-based HTML Rendering Engine.</p>
    </footer>

    <script>
        const PX_W = 794;            // A4 width at 96 dpi
        const PAGE_W_MM = 210;
        const PAGE_H_MM = 297;

        const textarea = document.getElementById('htmlInput');
        const previewFrame = document.getElementById('previewFrame');
        const convertBtn = document.getElementById('convertBtn');
        const BTN_TEXT = "⚡ Convert HTML to PDF & Download";

        // Wrap a fragment in a full document; keep full documents as they are
        function buildDoc(src) {
            if (/<html[\s>]/i.test(src)) return src;
            return `<!DOCTYPE html><html><head><meta charset="UTF-8"></head>
<body style="margin:0;padding:32px;font-family:Arial,Helvetica,sans-serif;color:#0f172a;background:#ffffff;">${src}</body></html>`;
        }

        function updatePreview() {
            previewFrame.srcdoc = buildDoc(textarea.value);
        }
        textarea.addEventListener('input', updatePreview);
        updatePreview();

        // Render the HTML in a hidden iframe and return a canvas screenshot
        async function renderToCanvas(src) {
            const frame = document.createElement('iframe');
            frame.style.cssText = `position:fixed;left:-10000px;top:0;width:${PX_W}px;height:1123px;border:0;background:#fff;`;
            document.body.appendChild(frame);
            try {
                await new Promise((resolve) => {
                    frame.onload = resolve;
                    frame.srcdoc = buildDoc(src);
                });
                const doc = frame.contentDocument;
                // Give CDN scripts (e.g. Tailwind) and web fonts time to apply
                await new Promise(r => setTimeout(r, 600));
                if (doc.fonts && doc.fonts.ready) await doc.fonts.ready;

                const height = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight, 1123);
                frame.style.height = height + 'px';

                return await html2canvas(doc.body, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    width: PX_W,
                    height: height,
                    windowWidth: PX_W,
                    windowHeight: height,
                    scrollX: 0,
                    scrollY: 0
                });
            } finally {
                frame.remove();
            }
        }

        // Slice the tall screenshot into A4 pages
        function canvasToPdf(canvas, filename) {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
            const pxPerMm = canvas.width / PAGE_W_MM;
            const pageHpx = Math.floor(PAGE_H_MM * pxPerMm);
            let y = 0;
            let first = true;

            while (y < canvas.height) {
                const sliceH = Math.min(pageHpx, canvas.height - y);
                const slice = document.createElement('canvas');
                slice.width = canvas.width;
                slice.height = sliceH;
                slice.getContext('2d').drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);

                if (!first) pdf.addPage();
                first = false;
                pdf.addImage(slice.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, PAGE_W_MM, sliceH / pxPerMm);
                y += pageHpx;
            }
            pdf.save(filename);
        }

        convertBtn.addEventListener('click', async function () {
            const src = textarea.value;
            if (!src.trim()) {
                alert("Please enter some HTML code to convert.");
                return;
            }

            convertBtn.innerText = "Generating PDF...";
            convertBtn.disabled = true;

            try {
                const canvas = await renderToCanvas(src);
                canvasToPdf(canvas, 'document_damnresize.pdf');
            } catch (err) {
                alert("Error generating PDF: " + err.message);
            } finally {
                convertBtn.innerText = BTN_TEXT;
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
