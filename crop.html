<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="intro.js?v=20261021"></script>
    <script src="navigation.js?v=20261021" defer></script>
    <title>Free Online Image Cropper - Crop JPG, PNG & WebP | DamnResize.in</title>
    <meta name="description" content="Crop images online for free. Trim unwanted edges, adjust aspect ratios, and crop JPG, PNG, and WebP pictures instantly.">
    <link rel="canonical" href="https://damnresize.in/crop.html">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-pink-500 selection:text-white">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4" style="visibility:hidden">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <a href="/" class="text-2xl font-black tracking-wider bg-gradient-to-r from-pink-400 to-purple-500 bg-clip-text text-transparent">DamnResize<span class="text-amber-400">.in</span></a>
            </div>
            <nav class="hidden md:flex space-x-6 text-sm font-medium text-slate-300">
                <a href="/" class="hover:text-pink-400 transition"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Home</a>
            </nav>
        </div>
    </header>

    <!-- Header Section -->
    <section class="py-12 px-6 text-center bg-gradient-to-b from-slate-900 to-slate-950 border-b border-slate-900">
        <div class="max-w-3xl mx-auto">
            <span class="inline-block bg-pink-500/10 text-pink-400 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider mb-3 border border-pink-500/20">⚡ Dedicated Cropper Tool</span>
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-4">Image Cropper <span class="text-pink-400">Online</span></h1>
            <p class="text-slate-400 text-sm md:text-base">Trim unwanted borders and focus directly on your image subject. Fast, secure, and easy to use.</p>
        </div>
    </section>

    <!-- Crop Tool Interface -->
    <section class="py-10 px-6 max-w-3xl mx-auto w-full flex-grow">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-pink-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-crop text-pink-400"></i> Upload & Crop Image
            </h2>
            
            <!-- File Input -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-300 mb-2">Select Image File</label>
                <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-pink-600 file:text-white hover:file:bg-pink-500 cursor-pointer border border-slate-700 rounded-xl bg-slate-950 p-2"/>
            </div>

            <!-- Workspace -->
            <div id="editorWorkspace" class="hidden space-y-6">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Crop X (px)</label>
                        <input type="number" id="cropX" value="0" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-pink-500"/>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Crop Y (px)</label>
                        <input type="number" id="cropY" value="0" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-pink-500"/>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Crop Width</label>
                        <input type="number" id="cropWidth" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-pink-500"/>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Crop Height</label>
                        <input type="number" id="cropHeight" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-pink-500"/>
                    </div>
                </div>

                <div class="flex flex-col items-center justify-center border-2 border-dashed border-slate-800 rounded-2xl p-6 bg-slate-950/50 min-h-[180px]">
                    <img id="imagePreview" class="max-h-60 rounded-lg shadow-md mb-2" alt="Cropped Preview"/>
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <button id="cropBtn" class="flex-1 bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3 px-6 rounded-xl transition shadow-lg shadow-pink-600/20">Crop Image</button>
                    <a id="downloadBtn" class="hidden flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-6 rounded-xl text-center transition shadow-lg shadow-emerald-600/20" download="cropped_image.jpg"><i class="fa-solid fa-download mr-2"></i>Download Cropped Image</a>
                </div>
            </div>

            <div id="placeholderBox" class="flex flex-col items-center justify-center border-2 border-dashed border-slate-800 rounded-2xl p-6 bg-slate-950/50 min-h-[180px]">
                <p class="text-slate-500 text-sm"><i class="fa-regular fa-image mr-2 text-lg block mb-2"></i>Upload an image above to start cropping</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 px-6 mt-auto text-center text-xs text-slate-500">
        <p>&copy; 2026 DamnResize.in. All rights reserved.</p>
    </footer>

    <!-- Script Logic -->
    <script>
        const imageInput = document.getElementById('imageInput');
        const cropX = document.getElementById('cropX');
        const cropY = document.getElementById('cropY');
        const cropWidth = document.getElementById('cropWidth');
        const cropHeight = document.getElementById('cropHeight');
        const imagePreview = document.getElementById('imagePreview');
        const editorWorkspace = document.getElementById('editorWorkspace');
        const placeholderBox = document.getElementById('placeholderBox');
        const cropBtn = document.getElementById('cropBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let loadedImage = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    loadedImage = new Image();
                    loadedImage.onload = function() {
                        cropX.value = 0;
                        cropY.value = 0;
                        cropWidth.value = loadedImage.width;
                        cropHeight.value = loadedImage.height;

                        imagePreview.src = event.target.result;
                        editorWorkspace.classList.remove('hidden');
                        placeholderBox.classList.add('hidden');
                        downloadBtn.classList.add('hidden');
                    }
                    loadedImage.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        cropBtn.addEventListener('click', () => {
            if (!loadedImage) return;

            const x = parseInt(cropX.value) || 0;
            const y = parseInt(cropY.value) || 0;
            const w = parseInt(cropWidth.value) || loadedImage.width;
            const h = parseInt(cropHeight.value) || loadedImage.height;

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(loadedImage, x, y, w, h, 0, 0, w, h);

            const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.95);
            imagePreview.src = croppedDataUrl;
            downloadBtn.href = croppedDataUrl;
            downloadBtn.classList.remove('hidden');
            alert('Image cropped successfully!');
        });
    </script>
</body>
</html>
